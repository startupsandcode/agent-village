name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix village
      - run: npm exec --prefix village -- playwright install chromium
      - run: node --test
